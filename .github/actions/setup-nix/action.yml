name: Setup Nix
description: Free runner disk space and install Nix with the features this flake needs.

runs:
  using: composite
  steps:
    # A full NixOS closure (incl. the from-source NVIDIA driver) needs more than the default ~14 GB free.
    - name: Free disk space
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes pipe-operators
