name: CI

# Disabled: prts builds on its own and keeps the old generation if the build fails;
# update-flake-lock.yml still builds prts before opening its PR. Manual runs only.
on:
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - run: nix flake check
      - run: nix build --print-build-logs .#nixosConfigurations.prts.config.system.build.toplevel
