name: Update flake.lock

on:
  schedule:
    - cron: "0 18 * * 5" # Fri 18:00 UTC (Sat 01:00 Bangkok)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix

      - name: Update inputs
        run: nix flake update 2>&1 | tee update.log

      # PRs opened with GITHUB_TOKEN don't trigger the CI workflow, so verify here.
      - run: nix flake check
      - run: nix build --print-build-logs .#nixosConfigurations.prts.config.system.build.toplevel

      - name: PR body
        run: |
          {
            echo '```'
            sed -n '/Updated input/,$p' update.log
            echo '```'
          } > pr-body.md

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-flake-lock
          commit-message: "flake.lock: update"
          title: "flake.lock: update"
          body-path: pr-body.md
          add-paths: flake.lock
          delete-branch: true
