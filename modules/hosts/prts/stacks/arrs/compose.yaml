# Arrs stack for media automation. Setup guide: ./arrs.md
#
# Every app is its own container on the stack's default network and reaches the others by
# service name (prowlarr:9696, qbittorrent:8080, ...); the apps store those links, so keep the
# service names. Apps with a web UI also join `caddy`, each with its own labels.
#
# Host paths come from .env, so the data and config can move (another dataset or pool) by
# changing .env alone:
#   ARRS_DATA    media library and torrents (one filesystem, for hardlinks)
#   ARRS_CONFIG  one <app>/config directory per app
#
# Container paths are fixed. The apps store them in their databases (root folders, every
# series and movie path, qBittorrent's save path, Jellyfin's libraries), so /mnt/starrs-data
# keeps its old name. It is the same in every container (and in the jellyfin stack) to enable
# the "Atomic Move" technique (hardlinking instead of copying files).

# Stack name in Dockhand and compose project name (network: arrs_default)
name: arrs

x-common-env: &common-env
  TZ: Asia/Bangkok
  # songpola:users on the host
  PUID: "1000"
  PGID: "100"

x-app: &app
  restart: unless-stopped
  networks:
    - default
    - caddy

# Kanidm login in front of every web UI (oauth2-proxy's `auth` snippet), so the apps' own
# logins are off where they allow it (Servarr apps: External; qui: auth disabled for the
# caddy subnet; qBittorrent: the caddy subnet skips its login, set in its UI as no env var
# exists). The apps reach each other on the stack network, never through Caddy, and log in
# to qBittorrent with its password. The caddy subnet (10.89.1.0/24) isn't pinned in Nix:
# if it changes, qui refuses and qBittorrent asks for its login (fails closed).
# Servarr apps take <APP>__AUTH__METHOD=External; their API keeps requiring the API key.
x-auth-labels: &auth-labels
  caddy.import: auth prts_admins@idm.songpola.dev

services:
  # Downloader: qBittorrent (will be used by Radarr/Sonarr)
  # IMPORTANT: See "qBittorrent - Basic Setup (TRaSH Guides)" in ./arrs.md
  qbittorrent:
    <<: *app
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: arrs-qbittorrent
    environment:
      <<: *common-env
      TORRENTING_PORT: "6882"
    ports:
      # Torrenting port
      - "6882:6882"
      - "6882:6882/udp"
    volumes:
      - ${ARRS_CONFIG:?set in .env}/qbittorrent/config:/config
      - ${ARRS_DATA:?set in .env}/torrents:/mnt/starrs-data/torrents
    mem_limit: 2g
    labels:
      <<: *auth-labels
      caddy: qbit.songpola.dev
      caddy.reverse_proxy: "{{upstreams 8080}}"
      dev.dozzle.url: https://qbit.songpola.dev

  # Guide Sync (configuration management)
  clonarr:
    <<: *app
    image: ghcr.io/prophetse7en/clonarr:latest
    container_name: arrs-clonarr
    environment: *common-env
    volumes:
      - ${ARRS_CONFIG:?set in .env}/clonarr/config:/config
    labels:
      <<: *auth-labels
      caddy: clonarr.songpola.dev
      caddy.reverse_proxy: "{{upstreams 6060}}"
      dev.dozzle.url: https://clonarr.songpola.dev
      # selfh.st icon (CC BY 4.0, https://selfh.st/icons), shrunk to 64x64 WebP to fit
      # Dozzle's 16 KB limit; Dozzle bundles none
      dev.dozzle.icon: "data:image/webp;base64,"

  # Indexer Proxies (for bypassing Cloudflare blocks on indexers); only Prowlarr uses it
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: arrs-byparr
    restart: unless-stopped

  # Indexer
  prowlarr:
    <<: *app
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: arrs-prowlarr
    environment:
      <<: *common-env
      PROWLARR__AUTH__METHOD: External
    volumes:
      - ${ARRS_CONFIG:?set in .env}/prowlarr/config:/config
      # BearBIT with its download ad gate handled (see the file)
      - ./prowlarr-bearbit.yml:/config/Definitions/Custom/bearbit.yml:ro
    labels:
      <<: *auth-labels
      caddy: prowlarr.songpola.dev
      caddy.reverse_proxy: "{{upstreams 9696}}"
      dev.dozzle.url: https://prowlarr.songpola.dev

  # Movies (Main)
  radarr:
    <<: *app
    image: lscr.io/linuxserver/radarr:latest
    container_name: arrs-radarr
    environment:
      <<: *common-env
      RADARR__SERVER__PORT: "7878" # Radarr default
      RADARR__AUTH__METHOD: External
    volumes:
      - ${ARRS_CONFIG:?set in .env}/radarr/config:/config
      - ${ARRS_DATA:?set in .env}:/mnt/starrs-data
    labels:
      <<: *auth-labels
      caddy: radarr.songpola.dev
      caddy.reverse_proxy: "{{upstreams 7878}}"
      dev.dozzle.url: https://radarr.songpola.dev

  # Movies (Anime); the port differs from the default only because Prowlarr and Clonarr
  # store it (it dates from the shared network namespace)
  radarr-anime:
    <<: *app
    image: lscr.io/linuxserver/radarr:latest
    container_name: arrs-radarr-anime
    environment:
      <<: *common-env
      RADARR__SERVER__PORT: "7879" # Radarr default + 1
      RADARR__AUTH__METHOD: External
    volumes:
      - ${ARRS_CONFIG:?set in .env}/radarr-anime/config:/config
      - ${ARRS_DATA:?set in .env}:/mnt/starrs-data
    labels:
      <<: *auth-labels
      caddy: radarr-anime.songpola.dev
      caddy.reverse_proxy: "{{upstreams 7879}}"
      dev.dozzle.url: https://radarr-anime.songpola.dev

  # TV Series (Main)
  sonarr:
    <<: *app
    image: lscr.io/linuxserver/sonarr:latest
    container_name: arrs-sonarr
    environment:
      <<: *common-env
      SONARR__SERVER__PORT: "8989" # Sonarr default
      SONARR__AUTH__METHOD: External
    volumes:
      - ${ARRS_CONFIG:?set in .env}/sonarr/config:/config
      - ${ARRS_DATA:?set in .env}:/mnt/starrs-data
    labels:
      <<: *auth-labels
      caddy: sonarr.songpola.dev
      caddy.reverse_proxy: "{{upstreams 8989}}"
      dev.dozzle.url: https://sonarr.songpola.dev

  # TV Series (Anime); port as for radarr-anime
  sonarr-anime:
    <<: *app
    image: lscr.io/linuxserver/sonarr:latest
    container_name: arrs-sonarr-anime
    environment:
      <<: *common-env
      SONARR__SERVER__PORT: "8990" # Sonarr default + 1
      SONARR__AUTH__METHOD: External
    volumes:
      - ${ARRS_CONFIG:?set in .env}/sonarr-anime/config:/config
      - ${ARRS_DATA:?set in .env}:/mnt/starrs-data
    labels:
      <<: *auth-labels
      caddy: sonarr-anime.songpola.dev
      caddy.reverse_proxy: "{{upstreams 8990}}"
      dev.dozzle.url: https://sonarr-anime.songpola.dev

  # qui for managing qBittorrent (qbittorrent:8080) and searching through Prowlarr
  # https://getqui.com/docs/getting-started/docker#local-filesystem-access
  qui:
    <<: *app
    image: ghcr.io/hotio/qui:latest
    container_name: qui
    environment:
      <<: *common-env
      # Login handled by the Kanidm gate: qui's own login is off, and it only accepts
      # requests from the caddy network (refuses everything else) for its own domain
      QUI__AUTH_DISABLED: "true"
      QUI__I_ACKNOWLEDGE_THIS_IS_A_BAD_IDEA: "true"
      QUI__AUTH_DISABLED_ALLOWED_CIDRS: 10.89.1.0/24
      QUI__ALLOWED_HOSTS: qui.songpola.dev
    volumes:
      - ${ARRS_CONFIG:?set in .env}/qui/config:/config
      - ${ARRS_DATA:?set in .env}/torrents:/mnt/starrs-data/torrents
    labels:
      <<: *auth-labels
      caddy: qui.songpola.dev
      caddy.reverse_proxy: "{{upstreams 7476}}"
      dev.dozzle.url: https://qui.songpola.dev
      # selfh.st icon (CC BY 4.0, https://selfh.st/icons), URL-encoded SVG; Dozzle bundles none
      dev.dozzle.icon: "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20xml%3Aspace%3D%22preserve%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cpath%20d%3D%22M45.6%2068.3c0-11.6%209.4-21.1%2021.1-21.1h65.9c11.6%200%2021.1%209.4%2021.1%2021.1s-9.4%2021.1-21.1%2021.1h-66c-11.6%200-21-9.4-21-21.1m-16.4%2081.6h41c11.6%200%2021.1-9.4%2021.1-21.1s-9.4-21.1-21.1-21.1h-41c-11.6%200-21.1%209.4-21.1%2021.1s9.5%2021.1%2021.1%2021.1m477-3c-5.7-26.3-39.5-57.5-88-81.5-26.6-13.2-56.3-23.6-88.1-31-35.7-8.3-73.1-12.5-111.2-12.5-.4%200-.9%200-1.3.1-10.3%201.8-18.8%207.8-24.6%2017.3-4.9%208-7.5%2018.3-7.4%2028.8.1%2010.4%202.8%2020.4%207.7%2028.2%205.8%209.2%2014.3%2015%2024.5%2016.5.5.1%201%20.1%201.5.1%2059.5-2.5%2088-2.1%20108.7%202-4.7%206.4-7.7%2012.1-10.1%2019.2-19.2-2.7-62.6-8.2-107.7-8.8-22.7-.3-42.3.7-58%202.9-19.4%202.8-33%207.5-41.5%2014.3-14.7%2011.7-26.4%2025.6-34.9%2041.4-4.6%208.5-8%2017.6-9.8%2025.4-9.7.1-19.9%201.3-28.7%203.7-14.9%204-25.6%2010.7-31.7%2019.9-7.7%2011.7-7.4%2026.2.9%2043%207.6%2015.4%2017.9%2024.3%2030.7%2026.3%2017%202.7%2033.6-8%2044.2-17%202.1%206.2%203.7%2014.4%203.6%2024.9-.3%2019.5-6.8%2041.8-19.3%2066.2-.2.4-.4.9-.5%201.4-1.9%206.8-3.2%2013.9.5%2020%203.6%206%2010.6%208.3%2016.4%209.6%2068%2020.2%2096.5%2040.3%20138.2%2080.6%201.3%201.2%202.9%202%204.7%202.1%201.2.1%202.5.1%203.9.1%2011.5%200%2026.2-3.6%2036.8-13.7%209.8-9.4%2014.5-22.4%2014-38.7-.1-1.9-.8-3.7-2.2-5.1l-38-38c-.5-.5-1.1-.9-1.7-1.3L195%20369.9v-2c15.6-4.5%2026.6-10.1%2035.9-18.1%209.6-8.3%2017.7-19.4%2026.8-36.8%205.8-1.4%2010-1.4%2016.9.2%204.2%207.7%204.4%2012.3-.5%2021.8l-13.8%206.4c-1.4.7-2.6%201.7-3.4%203.1l-11%2019c-.8%201.4-1.2%203.1-.9%204.8%202.5%2018.3%208.5%2030%2018.4%2035.8%2013.6%208%2031.6%202.7%2045.8-2.8.6-.2%201.1-.5%201.6-.9%2053.1-37.3%2074.1-69%2090.3-138.3%2013.8.9%2039.1%202.1%2047.6-.9%2011.5-3.9%2044.7-29.1%2057.1-59.8l.3-.9c1.1-4.3%202.2-6.5%203.1-8.4%204.1-8.5%204.2-12.2-3-45.2%22%20style%3D%22fill%3A%233b82f6%22%2F%3E%3C%2Fsvg%3E"

networks:
  caddy:
    external: true
