# iroh-relay configuration (see compose.yaml). Keys per iroh-relay v1.0.0.

# Plain HTTP behind Caddy, which terminates TLS. No [tls] block, so QUIC address discovery
# (which needs TLS) is off.
http_bind_addr = "[::]:3340"
enable_quic_addr_discovery = false

# Per-client cap on relayed bytes, so one client can't run up the bandwidth (1 MiB/s, with
# a 5 MiB burst)
[limits.client.rx]
bytes_per_second = 1048576
max_burst_bytes = 5242880

# Shared-token auth. The placeholder is replaced by IROH_RELAY_ACCESS_TOKEN at startup; the
# line must exist for the variable to be read
access.shared_token = ["REPLACED_BY_IROH_RELAY_ACCESS_TOKEN"]
