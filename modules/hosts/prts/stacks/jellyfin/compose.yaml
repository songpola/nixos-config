# Jellyfin for media streaming (with NVIDIA GPU)
#
# Plus a private Jikan (MyAnimeList API) for the MyAnimeList plugin. The public Jikan API
# shut down on 2026-10-01 (jikan-me/jikan-rest#613), and the plugin version that loads on
# 10.11.8 (6.6.5.1) hardcodes its endpoints: primary http://jikanapi.freemyip.com:8080/v4/
# (the plugin author's instance, also gone), backup https://api.jikan.moe/v4/. A timed-out
# Jikan call aborts the whole series refresh, so new episodes never appeared. The jikan
# service takes over the primary's name as a network alias (plain HTTP, so no certificate
# needed), and api.jikan.moe maps to 127.0.0.1 so the fallback fails at once instead of
# hanging. Drop all of this for the plugin's Jikan URL setting (6.6.5.5+) once Jellyfin is
# on 10.11.11+.
#
# Set JIKAN_APP_KEY (`"base64:" + (random binary 32 | encode base64)` in nushell) and
# JIKAN_TYPESENSE_API_KEY (`random chars --length 32`) in Dockhand's encrypted stack
# variables. Search only covers anime already in Jikan's database: after the first deploy,
# fill it once with `podman exec -d jikan php artisan indexer:anime --delay=3` (30k
# entries, about two days; resume an interrupted run with --resume). New seasons are then
# indexed daily by Jikan's own scheduler, and lookups by MAL ID scrape MAL on demand.
name: jellyfin

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:version-10.11.8ubu2404
    container_name: jellyfin
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      # songpola:users on the host
      PUID: "1000"
      PGID: "100"
      # JELLYFIN_PublishedServerUrl:
    volumes:
      - /tank/v2/services/jellyfin/config:/config
      # The arrs stack's media (host path from .env, same value as there). Same container path
      # as in that stack, so the paths the arrs report match Jellyfin's libraries; fixed,
      # because Jellyfin stores it per library and item (watch state is keyed by path)
      - ${ARRS_DATA:?set in .env}/media:/mnt/starrs-data/media
    # NVIDIA GPU via CDI (hardware.nvidia-container-toolkit)
    devices:
      - nvidia.com/gpu=all
    # The LDAP plugin talks LDAPS to Kanidm on the host (port 636). On the caddy network this
    # domain resolves to Caddy (a network alias), which doesn't carry LDAP; mapping it to the
    # host keeps certificate verification on the real name
    extra_hosts:
      - "idm.songpola.dev:host-gateway"
      # The MyAnimeList plugin's backup Jikan, dead: refuse it at once (see the top)
      - "api.jikan.moe:127.0.0.1"
    networks:
      - caddy
      - jikan
    labels:
      caddy: jf.songpola.dev
      caddy.reverse_proxy: "{{upstreams 8096}}"
      dev.dozzle.url: https://jf.songpola.dev

  # Jikan REST API, the plugin author's fork (maintained; the official image dates from
  # 2024). Only `latest` is published, so it's pinned by digest
  jikan:
    image: ghcr.io/ryandash/jikan-rest:latest@sha256:0405dd4a388a2c0c632bb344a8a59491f5ad1445f68e3c36950762fb50abc472
    container_name: jikan
    restart: unless-stopped
    environment:
      APP_KEY: ${JIKAN_APP_KEY:?set in Dockhand stack variables}
      # Its own address; the indexers fetch through it (the default lacks the port)
      APP_URL: http://localhost:8080
      DB_HOST: jikan-mongodb
      # Search needs Typesense: the fork's MongoDB-only mode ("none") fails every write
      SCOUT_DRIVER: typesense
      TYPESENSE_HOST: jikan-typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${JIKAN_TYPESENSE_API_KEY:?set in Dockhand stack variables}
      GITHUB_REPORTING: "false"
    depends_on:
      - jikan-mongodb
      - jikan-typesense
    networks:
      # Jellyfin reaches it here as the plugin's hardcoded primary (port 8080)
      jikan:
        aliases:
          - jikanapi.freemyip.com
      # Internet access to scrape MyAnimeList
      default:

  # MongoDB without auth: reachable only on the internal jikan network, and holds only
  # scraped public data
  jikan-mongodb:
    image: mongo:8.0.34
    container_name: jikan-mongodb
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1"]
    volumes:
      - jikan-mongodb:/data/db
    networks:
      - jikan

  jikan-typesense:
    image: typesense/typesense:30.2
    container_name: jikan-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${JIKAN_TYPESENSE_API_KEY:?set in Dockhand stack variables}
      TYPESENSE_DATA_DIR: /data
    volumes:
      - jikan-typesense:/data
    networks:
      - jikan

volumes:
  jikan-mongodb:
  jikan-typesense:

networks:
  caddy:
    external: true
  # Jellyfin, Jikan and its databases; no internet (Jikan also joins default for that)
  jikan:
    internal: true
